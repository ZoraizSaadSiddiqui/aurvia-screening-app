<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aurvia — Threshold Verification</title>

  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:              #f0f4ff;
      --surface:         #ffffff;
      --surface-hi:      #f5f7ff;
      --border:          #d0d8f0;
      --accent:          #3d6cff;
      --accent-glow:     rgba(61,108,255,0.15);
      --text-primary:    #1a2240;
      --text-muted:      #6b7aaa;
      --stable-bg:       rgba(16,185,129,0.08);
      --stable-border:   #10b981;
      --stable-text:     #0d9466;
      --critical-bg:     rgba(239,68,68,0.08);
      --critical-border: #ef4444;
      --critical-text:   #dc2626;
      --warn-bg:         rgba(251,191,36,0.08);
      --warn-border:     #f59e0b;
      --warn-text:       #b45309;
      --radius:          12px;
      --mono:            'JetBrains Mono', 'Fira Code', monospace;
      --shadow:          0 4px 24px rgba(61,108,255,0.08), 0 1px 4px rgba(0,0,0,0.06);
    }

    body {
      background: var(--bg);
      background-image:
        radial-gradient(ellipse 80% 50% at 50% -10%, rgba(61,108,255,0.12) 0%, transparent 70%),
        radial-gradient(ellipse 60% 40% at 80% 90%, rgba(99,102,241,0.08) 0%, transparent 60%);
      color: var(--text-primary);
      font-family: 'Inter', system-ui, sans-serif;
      min-height: 100vh;
    }

    @keyframes pulse  { 0%,100%{opacity:1} 50%{opacity:0.35} }
    @keyframes spin   { to { transform: rotate(360deg); } }
    @keyframes fadeUp { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }

    .page-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 56px 16px 80px;
      min-height: 100vh;
    }

    .page-header { text-align: center; margin-bottom: 44px; }


    .page-title {
      font-size: clamp(28px, 5vw, 42px);
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.12;
      color: var(--text-primary);
    }
    .page-title span { color: var(--accent); }

    .page-subtitle {
      margin-top: 12px;
      color: var(--text-muted);
      font-size: 15px;
      max-width: 480px;
      line-height: 1.6;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 36px;
      width: 100%;
      max-width: 640px;
      box-shadow: var(--shadow);
    }

    .field { margin-bottom: 24px; }

    .field-label {
      display: block;
      font-size: 11px;
      font-family: var(--mono);
      letter-spacing: 0.08em;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-bottom: 8px;
      font-weight: 600;
    }
    .field-label .req { color: var(--accent); margin-left: 3px; }

    textarea, input[type="number"] {
      width: 100%;
      background: var(--surface-hi);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-primary);
      font-family: var(--mono);
      font-size: 14px;
      padding: 12px 14px;
      outline: none;
      transition: border-color .2s, box-shadow .2s, background .2s;
    }
    textarea { resize: vertical; }
    textarea::placeholder, input::placeholder { color: var(--text-muted); opacity: 0.7; }
    textarea:focus, input[type="number"]:focus {
      border-color: var(--accent);
      background: #fff;
      box-shadow: 0 0 0 3px var(--accent-glow);
    }
    textarea:disabled, input[type="number"]:disabled { opacity: 0.5; cursor: not-allowed; }

    .hint { margin-top: 6px; font-size: 12px; color: var(--text-muted); }

    .btn-check {
      width: 100%;
      padding: 14px;
      background: var(--accent);
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: opacity .2s, transform .15s, box-shadow .2s;
      margin-top: 4px;
      letter-spacing: 0.01em;
      box-shadow: 0 4px 16px rgba(61,108,255,0.30);
    }
    .btn-check:hover:not(:disabled) {
      opacity: .92;
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(61,108,255,0.38);
    }
    .btn-check:active:not(:disabled) { transform: translateY(0); box-shadow: none; }
    .btn-check:disabled { opacity: .55; cursor: not-allowed; box-shadow: none; }

    .spinner {
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,.35);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      flex-shrink: 0;
    }

    .divider {
      border: none;
      border-top: 1px solid var(--border);
      margin: 30px 0;
    }

    .result-box {
      border-radius: 10px;
      padding: 22px 24px;
      animation: fadeUp .35s ease;
    }
    .result-box.stable   { background: var(--stable-bg);   border: 1px solid var(--stable-border); color: var(--stable-text); }
    .result-box.critical { background: var(--critical-bg); border: 1px solid var(--critical-border); color: var(--critical-text); }
    .result-box.error    { background: var(--warn-bg);     border: 1px solid var(--warn-border);    color: var(--warn-text); }

    .result-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }
    .status-icon  { font-size: 20px; line-height: 1; }
    .status-label {
      font-size: 17px;
      font-weight: 800;
      letter-spacing: 0.06em;
      font-family: var(--mono);
    }

    .result-meta {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 10px;
    }

    .meta-item {
      background: rgba(255,255,255,0.7);
      border: 1px solid rgba(0,0,0,0.06);
      border-radius: 8px;
      padding: 12px 14px;
    }
    .meta-label {
      font-size: 10px;
      font-family: var(--mono);
      letter-spacing: 0.08em;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-bottom: 5px;
      font-weight: 600;
    }
    .meta-value {
      font-size: 17px;
      font-weight: 700;
      font-family: var(--mono);
      color: inherit;
    }

    .error-detail {
      font-family: var(--mono);
      font-size: 13px;
      line-height: 1.65;
      white-space: pre-wrap;
    }

    .page-footer {
      margin-top: 44px;
      font-size: 11px;
      font-family: var(--mono);
      color: var(--text-muted);
      letter-spacing: 0.06em;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useCallback } = React;

    function parseValues(raw) {
      const trimmed = raw.trim();
      if (!trimmed) return { values: null, error: "Stream values field is empty." };
      const parts = trimmed.split(",").map(s => s.trim()).filter(s => s !== "");
      if (!parts.length) return { values: null, error: "No values found after parsing." };
      const values = [];
      for (const part of parts) {
        const num = Number(part);
        if (isNaN(num)) return { values: null, error: `"${part}" is not a valid number. Only numeric values are accepted.` };
        values.push(num);
      }
      return { values, error: null };
    }

    
        function Spinner() {
      return <span className="spinner" />;
    }

    function MetaItem({ label, value }) {
      return (
        <div className="meta-item">
          <div className="meta-label">{label}</div>
          <div className="meta-value">{value}</div>
        </div>
      );
    }

    function ResultBox({ result }) {
      if (!result) return null;
      const map = {
        stable:   { icon: "✅", label: "STABLE" },
        critical: { icon: "🚨", label: "CRITICAL" },
        error:    { icon: "⚠️", label: "ERROR" },
      };
      const { icon, label } = map[result.type];
      return (
        <div className={`result-box ${result.type}`}>
          <div className="result-header">
            <span className="status-icon">{icon}</span>
            <span className="status-label">{label}</span>
          </div>
          {result.type === "error" ? (
            <div className="error-detail">{result.message}</div>
          ) : (
            <div className="result-meta">
              <MetaItem label="Average"      value={result.average} />
              <MetaItem label="Max Variance" value={`±${result.max_variance}`} />
              <MetaItem label="Elements"     value={result.element_count} />
            </div>
          )}
        </div>
      );
    }

    function App() {
      const [streamValue, setStreamValue] = useState("");
      const [maxVariance, setMaxVariance] = useState("");
      const [loading,     setLoading]     = useState(false);
      const [result,      setResult]      = useState(null);

      const handleCheck = useCallback(async () => {
        if (loading) return;
        setLoading(true);

        const parsed = parseValues(streamValue);
        if (parsed.error) {
          setResult({ type: "error", message: parsed.error });
          setLoading(false);
          return;
        }

        const maxVar = parseFloat(maxVariance);
        if (maxVariance.trim() === "" || isNaN(maxVar)) {
          setResult({ type: "error", message: "Max Variance must be a valid number." });
          setLoading(false);
          return;
        }

        try {
          const res  = await fetch("/api/threshold", {
            method:  "POST",
            headers: { "Content-Type": "application/json" },
            body:    JSON.stringify({ stream_values: parsed.values, max_variance: maxVar }),
          });
          const data = await res.json();

          if (!res.ok) {
            const detail = Array.isArray(data.detail)
              ? data.detail.map(d => typeof d === "object" ? d.msg : d).join("\n")
              : (data.detail || data.error || "Server returned an error.");
            setResult({ type: "error", message: detail });
          } else {
            setResult({
              type:          data.status === "STABLE" ? "stable" : "critical",
              average:       data.average,
              max_variance:  data.max_variance,
              element_count: data.element_count,
            });
          }
        } catch (err) {
          setResult({ type: "error", message: `Network error — could not reach the server.\n${err.message}` });
        } finally {
          setLoading(false);
        }
      }, [loading, streamValue, maxVariance]);

      return (
        <div className="page-wrap">
          <header className="page-header">
             <h1 className="page-title">
              Threshold <span>Verification</span>
            </h1>
            <p className="page-subtitle">
              Submit a stream of numeric values and a variance threshold to evaluate pipeline stability.
            </p>
          </header>

          <div className="card">
            <div className="field">
              <label className="field-label">
                Stream Values<span className="req">*</span>
              </label>
              <textarea
                rows={3}
                placeholder="e.g.  10, 15, 22, 19, 8"
                value={streamValue}
                onChange={e => setStreamValue(e.target.value)}
                disabled={loading}
              />
              <div className="hint">Comma-separated numeric values only — no strings or blanks.</div>
            </div>

            <div className="field">
              <label className="field-label">
                Max Variance<span className="req">*</span>
              </label>
              <input
                type="number"
                step="any"
                placeholder="e.g.  5"
                value={maxVariance}
                onChange={e => setMaxVariance(e.target.value)}
                onKeyDown={e => e.key === "Enter" && handleCheck()}
                disabled={loading}
              />
              <div className="hint">Maximum allowed deviation of any element from the stream mean.</div>
            </div>

            <button className="btn-check" onClick={handleCheck} disabled={loading}>
              {loading ? <><Spinner /> Analysing Stream…</> : "Check Metrics"}
            </button>

            {result && (
              <>
                <hr className="divider" />
                <ResultBox result={result} />
              </>
            )}
          </div>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
